[workspace]
members = [
  "crates/config-model",
  "crates/routing-core",
  "crates/pac-compiler",
  "crates/routing-wasm"
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/nightwhite/SwitchyPeformance"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.19"
url = "2.5.8"
regex-lite = "0.1.9"
wasm-bindgen = "0.2.126"
